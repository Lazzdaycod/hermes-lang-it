  fieldDescriptions:
    model: Usato per nuove chat a meno che tu non scelga un modello diverso nel compositore.
    modelContextLength: Sovrascrive la finestra di contesto rilevata solo per il modello di chat PRINCIPALE (token). Lascia a 0 per usare il valore rilevato del modello selezionato. Non influisce sui modelli ausiliari/MoA.
    fallbackProviders: Voci provider:modello di backup da provare se il modello predefinito fallisce.
    display:
      personality: Stile assistente predefinito per nuove sessioni.
      showReasoning: Mostra le sezioni di ragionamento quando il backend le fornisce.
    desktop:
      repoScanEnabled: Scansiona le cartelle locali per i repository Git da mostrare in Progetti.
      repoScanRoots: Cartelle da scansionare. Lascia vuoto per scansionare la directory home.
      repoScanExcludePaths: Cartelle e loro discendenti da saltare durante la scoperta dei repository.
    timezone: Identificatore fuso orario IANA. Se vuoto, usa il fuso orario di sistema.
    browser:
      useRealProfile: La navigazione locale usa i tuoi accessi reali. Hermes copia il profilo del tuo browser predefinito (cookie, accessi, preferenze) in uno snapshot gestito e lo pilota con il suo Chromium incluso — il tuo profilo live non viene mai aperto direttamente e la copia viene aggiornata da esso ad ogni esecuzione. Consente anche all'agente di aprire una sessione locale con profilo reale su richiesta, anche quando è configurato un backend browser cloud. Sono supportati solo browser Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); un predefinito non Chromium fallisce con un messaggio chiaro. Disattivato di default.
    agent:
      imageInputMode: Controlla come gli allegati immagine vengono inviati al modello.
      maxTurns: Limite superiore per i turni di chiamata strumenti prima che Hermes fermi un'esecuzione.
    terminal:
      cwd: Cartella progetto predefinita per strumenti e terminale.
      persistentShell: Mantieni lo stato della shell tra i comandi se il backend lo supporta.
      envPassthrough: Variabili d'ambiente da passare all'esecuzione degli strumenti.
      dockerImage: Immagine container usata quando il backend di esecuzione è Docker.
      singularityImage: Immagine usata quando il backend di esecuzione è Singularity.
      modalImage: Immagine usata quando il backend di esecuzione è Modal.
      daytonaImage: Immagine usata quando il backend di esecuzione è Daytona.
    codeExecution:
      mode: Quanto rigorosamente l'esecuzione del codice è limitata al progetto corrente.
    fileReadMaxChars: Numero massimo di caratteri che Hermes può leggere da una richiesta file.
    approvals:
      mode: Come Hermes gestisce i comandi che richiedono approvazione esplicita.
      timeout: Quanto tempo le richieste di approvazione attendono prima del timeout.
    security:
      redactSecrets: Nascondi i segreti rilevati dal contenuto visibile al modello quando possibile.
    checkpoints:
      enabled: Crea snapshot di rollback prima delle modifiche ai file.
    memory:
      memoryEnabled: Salva memorie durevoli che possono aiutare le sessioni future.
      userProfileEnabled: Mantieni un profilo compatto delle preferenze utente.
    context:
      engine: Strategia per gestire conversazioni lunghe vicino al limite di contesto.
    compression:
      enabled: Riassumi il contesto più vecchio quando le conversazioni diventano grandi.
      codexGpt55Autoraise: Aumenta la compressione all'85% per i modelli ChatGPT Codex OAuth supportati.
    auxiliary:
      compression:
        timeout: Secondi da attendere per il modello di compressione ausiliario per chiamata (default 120). Aumenta per modelli locali lenti.
    voice:
      autoTts: Parla automaticamente le risposte dell'assistente.
      voiceChatMode: "chained: riconoscimento vocale → Hermes → sintesi vocale con i provider sottostanti. gpt-live: un modello vocale OpenAI full-duplex (gpt-live-1) ascolta e parla, e passa ogni richiesta reale a Hermes — qualsiasi modello selezionato risponde con l'intero set di strumenti. Richiede una chiave API OpenAI; il layer vocale addebita $0,05 al minuto."
      gptLive:
        voice: Voce per la modalità GPT-Live. Sono accettati ID voce personalizzati.
        instructions: Frasi aggiuntive per la persona vocale live (tono, ritmo, lingua). Hermes mantiene il proprio prompt di sistema.
    tts:
      xai:
        voiceId: ID voce xAI (es. eve) o un ID voce personalizzato.
        language: Codice lingua parlata (es. en, pt-BR) o "auto" per il rilevamento automatico.
        speed: Velocità di riproduzione. 0.7 = più lenta, 1.0 = normale, 1.5 = più veloce.
        autoSpeechTags: Consenti a un LLM di inserire tag audio espressivi ([laughing], [sighs]) nello script prima della sintesi.
        optimizeStreamingLatency: Compromesso tra latenza e qualità. 0 = migliore qualità, 2 = latenza minima.
        sampleRate: Frequenza di campionamento audio in Hz. Più alta = migliore qualità, file più grandi.
        bitRate: Bitrate MP3 in bps. Si applica solo quando il codec è mp3.
      neutts:
        device: Dispositivo di inferenza locale per NeuTTS.
    stt:
      enabled: Abilita la trascrizione vocale locale o basata su provider.
      echoTranscripts: Pubblica la trascrizione grezza 🎙️ dei messaggi vocali nella chat.
      streaming: Mostra il testo mentre parli (OpenAI, xAI, ElevenLabs). In caso di fallimento, torna alla registrazione.
      elevenlabs:
        languageCode: Codice lingua ISO-639-3 facoltativo. Se vuoto, ElevenLabs rileva automaticamente.
    updates:
      nonInteractiveLocalChanges: Quando Hermes si aggiorna da solo dall'app (senza prompt terminale), mantieni le modifiche al codice locale (stash) o scartale (discard). Gli aggiornamenti da terminale chiedono sempre.
