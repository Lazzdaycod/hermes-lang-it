      auth: Il servizio AI ha rifiutato il tuo accesso. Controlla le credenziali per questo provider, poi invia di nuovo il tuo messaggio.
      billing: Il tuo account non ha più credito per questo provider. Ricarica o cambia provider, poi invia di nuovo.
      disk: Il tuo disco è pieno, quindi Hermes non ha potuto salvare questa conversazione. Libera dello spazio, poi riprova.
      endpoint: Hermes non può raggiungere il tuo server di modelli personalizzato. Controlla che sia in esecuzione, poi invia di nuovo il tuo messaggio.
      gateway: Hermes ha riscontrato un problema interno nell'avviare questa risposta. Invia di nuovo il tuo messaggio; se continua, invia le diagnostiche.
      generic: Qualcosa è andato storto mentre Hermes rispondeva. Riprova, o copia i dettagli se continua.
      provider: Il servizio AI non ha potuto completare questa richiesta. Riprova tra un momento o cambia provider.
      runtime: Hermes ha riscontrato un problema interno nell'avviare questa risposta. Invia di nuovo il tuo messaggio; se continua, invia le diagnostiche.
      streaming: La connessione si è interrotta prima che la risposta finisse. Riprova per inviarla di nuovo.
    errorCodes:
      billing:
        title: Credito esaurito
        body: Il tuo account {0} non ha più crediti. Ricarica o cambia provider, poi invia di nuovo.
      rate_limit:
        title: Il servizio AI è occupato
        body: '{0} sta limitando le richieste in questo momento. Aspetta un minuto, poi riprova.'
      upstream_rate_limit:
        title: Il servizio AI è occupato
        body: '{0} sta limitando le richieste in questo momento. Aspetta un minuto, poi riprova.'
      overloaded:
        title: Il servizio AI è sovraccarico
        body: '{0} sta avendo problemi in questo momento. Riprova tra un momento o cambia provider.'
      server_error:
        title: Il servizio AI ha avuto un problema
        body: '{0} ha restituito un errore del server. Riprova tra un momento o cambia provider.'
      timeout:
        title: Impossibile raggiungere il servizio AI
        body: Non è stato possibile raggiungere {0} o non ha risposto in tempo. Controlla la connessione internet, poi riprova.
      stream_drop:
        title: La risposta è stata interrotta
        body: La connessione si è interrotta prima che la risposta finisse. Riprova per inviarla di nuovo.
      no_reply:
        title: La risposta non è finita
        body: Hermes ha terminato questo turno senza una risposta. Riprova per inviarla di nuovo.
      upstream_blocked:
        title: Un firewall ha bloccato la richiesta
        body: Un firewall o CDN davanti a {0} ha bloccato la richiesta prima che raggiungesse il modello — la tua chiave è probabilmente valida. Imposta un header User-Agent tramite extra_headers del provider nelle Impostazioni, o cambia provider, poi invia di nuovo il messaggio.
      ssl_cert_verification:
        title: Connessione sicura non riuscita
        body: Hermes non è riuscito a verificare la connessione sicura con {0}. Controlla le impostazioni di rete o proxy, o cambia provider, poi invia di nuovo il messaggio.
      context_overflow:
        title: Questa conversazione è troppo lunga
        body: La conversazione non rientra più nel modello. Comprimila o avvia una nuova chat, poi invia di nuovo.
      payload_too_large:
        title: Questo messaggio è troppo grande
        body: La richiesta era troppo grande per il modello. Comprimi la conversazione o avvia una nuova chat, poi invia di nuovo.
      model_not_found:
        title: Questo modello non è disponibile
        body: '{0} non offre questo modello sul tuo account. Scegli un altro modello, poi invia di nuovo il messaggio.'
      provider_policy_blocked:
        title: Questo modello è bloccato dalle impostazioni del tuo account
        body: '{0} non ha instradato questa richiesta a causa delle impostazioni di dati o privacy del tuo account. Scegli un altro modello o cambia provider.'
      content_policy_blocked:
        title: Il servizio AI ha rifiutato questa richiesta
        body: '{0} non ha risposto a questo messaggio. Modificalo e invialo di nuovo.'
      format_error:
        title: Il servizio AI ha rifiutato la richiesta
        body: '{0} non ha accettato la struttura di questa richiesta. Cambia provider o invia le diagnostiche così possiamo indagare.'
